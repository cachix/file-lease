[package]
name = "file-lease"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/cachix/file-lease"
description = "Process-owned memory-backed files with automatic cleanup"
readme = "README.md"

[features]
# Internal diagnostics for synthetic benchmarks; disabled in ordinary builds.
profiling = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
wait-timeout = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.0"
wait-timeout = "0.2"
