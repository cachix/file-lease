[package]
name = "file-lease"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/cachix/file-lease"
description = "Process-owned memory-backed files with automatic cleanup"
readme = "README.md"

[features]
default = ["shared-volumes"]
# Internal diagnostics for synthetic benchmarks. Not covered by semver.
unstable-profiling = []
# Share macOS volumes across overlapping leases from one process.
shared-volumes = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["net"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
memmap2 = "0.9.12"
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1", features = ["fs"] }
core-foundation = "0.10"
wait-timeout = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.0"
wait-timeout = "0.2"
