name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Storage and lifecycle (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test leases, crash recovery, deadlines, and volume exhaustion
        # macOS tests exercise real RAM volumes and interrupted recovery.
        run: cargo test --locked --all-features -- --test-threads=1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os == 'macOS'
        with:
          persist-credentials: false
          ref: 05b802b15bc8daf136bb068bec992c60b15bf96b
          path: baseline
      - name: Compare overlapping independent leases
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/file-lease-benchmark"
          mkdir -p "$results/ab"
          chmod 700 "$results" "$results/ab"
          cp examples/shared_volume_timings.rs baseline/examples/shared_volume_timings.rs
          CARGO_TARGET_DIR="$RUNNER_TEMP/file-lease-baseline-target" cargo build --locked --release --manifest-path baseline/Cargo.toml --example shared_volume_timings
          cargo build --locked --release --features shared-volumes --example shared_volume_timings
          baseline_bin="$RUNNER_TEMP/file-lease-baseline-target/release/examples/shared_volume_timings"
          pooled_bin="$GITHUB_WORKSPACE/target/release/examples/shared_volume_timings"
          for round in 0 1 2; do
            variants="baseline pooled"
            if [[ "$round" == 1 ]]; then variants="pooled baseline"; fi
            for variant in $variants; do
              if [[ "$variant" == baseline ]]; then executable="$baseline_bin"; else executable="$pooled_bin"; fi
              "$executable" --samples 10 --parallel 4 > "$results/ab/$variant-$round.csv"
            done
          done
          mkdir -p "$results/spillover"
          for variant in baseline pooled; do
            if [[ "$variant" == baseline ]]; then executable="$baseline_bin"; else executable="$pooled_bin"; fi
            "$executable" --samples 3 --parallel 4 --payload-mib 24 > "$results/spillover/$variant.csv"
          done
      - name: Measure release latency and internal phases
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/file-lease-benchmark"
          mkdir -p "$results/phases"
          chmod 700 "$results" "$results/phases"
          uname -a | tee "$results/host.txt"
          rustc --version | tee -a "$results/host.txt"
          cargo run --locked --release --example lifecycle_timings | tee "$results/release.csv"
          _FILE_LEASE_PROFILE_DIR="$results/phases" cargo run --locked --release --features profiling --example lifecycle_timings | tee "$results/profiled.csv"
          python3 scripts/summarize_timings.py "$results" | tee "$results/summary.csv"
          {
            echo '### Release latency and nested phase timings (milliseconds)'
            echo 'Phase spans nest and must not be added together. Profiling adds diagnostic IO.'
            echo '```csv'
            cat "$results/summary.csv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lifecycle-timings-${{ matrix.runner }}
          path: ${{ runner.temp }}/file-lease-benchmark/
          if-no-files-found: warn
